apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-service
  namespace: demo-app
spec:
  replicas: 3   # 🔥 Load balanced pods
  selector:
    matchLabels:
      app: springboot
  template:
    metadata:
      labels:
        app: springboot
    spec:
      containers:
      - name: springboot
        image: springboot-service:latest   # push this image to ECR
        ports:
        - containerPort: 8089
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-service:3306/demo"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "Macky@21"
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-service
  namespace: demo-app
spec:
  type: ClusterIP
  selector:
    app: springboot
  ports:
    - port: 80
      targetPort: 8089
